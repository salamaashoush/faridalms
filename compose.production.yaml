# One regional cell. Postgres is external; every connection URL names its own
# login role (see docs/operations.md). Ports bind to loopback for the edge
# proxy in front, which terminates TLS and appends X-Forwarded-For.
x-cell-secret: &cell-secret ${CELL_SECRET:?Set CELL_SECRET, 32 random bytes in base64}
# Shared by ops and the provisioner only; the api service never receives it.
x-provision-secret: &provision-secret ${PROVISION_SECRET:-}

services:
  migrate:
    build:
      context: .
      target: migrate
    command: ["bun", "migrate.js", "create"]
    environment:
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?Set the cluster admin URL used for migrations}
      CELL_DATABASE: ${CELL_DATABASE:-cell}
      DIRECTORY_DATABASE: ${DIRECTORY_DATABASE:-directory}
      CELL_ROLE_PASSWORD: ${CELL_ROLE_PASSWORD:-}
    restart: "no"

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      CELL_ID: ${CELL_ID:?Set the cell id, for example eg-1}
      CELL_KEK: ${CELL_KEK:?Set CELL_KEK, 32 random bytes in base64}
      CELL_SECRET: *cell-secret
      CELL_APP_URL: ${CELL_APP_URL:?Set the app role URL}
      CELL_SITE_URL: ${CELL_SITE_URL:?Set the site role URL}
      # Settles uploads and delivers notifications; without it neither happens.
      CELL_WORKER_URL: ${CELL_WORKER_URL:?Set the worker role URL}
      CELL_RETENTION_URL: ${CELL_RETENTION_URL:?Set the retention role URL}
      DIRECTORY_URL: ${DIRECTORY_URL:?Set the directory_reader URL}
      # Reports storage and binds and checks schools' own hosts.
      DIRECTORY_SYNC_URL: ${DIRECTORY_SYNC_URL:-}
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?Set the portal domain, for example faridalms.com}
      SITES_DOMAIN: ${SITES_DOMAIN:?Set the sites domain, for example faridalms.site}
      EDGE_IPV4: ${EDGE_IPV4:-}
      FILES_ORIGIN: ${FILES_ORIGIN:?Set the files host origin, its own domain}
      MEDIA_ORIGIN: ${MEDIA_ORIGIN:-}
      FILE_STORAGE: ${FILE_STORAGE:-disk}
      FILE_STORAGE_DIR: /data/files
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      FILE_BUCKET: ${FILE_BUCKET:-}
      PUBLIC_MEDIA_BUCKET: ${PUBLIC_MEDIA_BUCKET:-}
      CLAMD_ADDRESS: ${CLAMD_ADDRESS:-}
      EMAIL_WEBHOOK_URL: ${EMAIL_WEBHOOK_URL:-}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      NOTIFY_WEBHOOK_TOKEN: ${NOTIFY_WEBHOOK_TOKEN:-}
      # The AGPL asks whoever runs a changed copy to offer its source.
      SOURCE_URL: ${SOURCE_URL:-}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      FILES_PORT: 3003
    volumes:
      - files:/data/files
    ports:
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:3003:3003"
    stop_grace_period: 30s

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:3001
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?Set the portal domain, for example faridalms.com}
      SITES_DOMAIN: ${SITES_DOMAIN:?Set the sites domain, for example faridalms.site}
      COLLAB_URL: ${COLLAB_URL:-}
      PLAY_URL: ${PLAY_URL:-}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 30s

  collab:
    build:
      context: .
      target: collab
    restart: unless-stopped
    environment:
      CELL_COLLAB_URL: ${CELL_COLLAB_URL:?Set the collab role URL}
      CELL_SECRET: *cell-secret
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s

  # The same image as api, holding the provisioner login (which may become
  # cell_owner) to create schools for the console. It publishes no port and
  # shares its only inbound network with ops, so nothing else reaches it.
  provisioner:
    build:
      context: .
      target: api
    restart: unless-stopped
    profiles: ["ops"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      CELL_ID: ${CELL_ID:?Set the cell id, for example eg-1}
      CELL_KEK: ${CELL_KEK:?Set CELL_KEK, 32 random bytes in base64}
      CELL_SECRET: *cell-secret
      CELL_APP_URL: ${CELL_APP_URL:?Set the app role URL}
      DIRECTORY_URL: ${DIRECTORY_URL:?Set the directory_reader URL}
      # The first administrator's link points at the school's portal.
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?Set the portal domain, for example faridalms.com}
      SITES_DOMAIN: ${SITES_DOMAIN:?Set the sites domain, for example faridalms.site}
      CELL_PROVISION_URL: ${CELL_PROVISION_URL:-}
      PROVISION_SECRET: *provision-secret
      PROVISION_PORT: 3005
      PROVISION_HOST: 0.0.0.0
      # The first administrator's link goes out before the school is kept.
      EMAIL_WEBHOOK_URL: ${EMAIL_WEBHOOK_URL:-}
      NOTIFY_WEBHOOK_TOKEN: ${NOTIFY_WEBHOOK_TOKEN:-}
    networks:
      - provision
      - provisioner-egress
    stop_grace_period: 30s

  ops:
    build:
      context: .
      target: ops
    restart: unless-stopped
    profiles: ["ops"]
    # Its preflight refuses to start without every OPS_ and PROVISION_ variable.
    environment:
      OPS_DIRECTORY_URL: ${OPS_DIRECTORY_URL:-}
      OPS_ORIGIN: ${OPS_ORIGIN:-}
      OPS_OIDC_ISSUER: ${OPS_OIDC_ISSUER:-}
      OPS_OIDC_CLIENT_ID: ${OPS_OIDC_CLIENT_ID:-}
      OPS_OIDC_CLIENT_SECRET: ${OPS_OIDC_CLIENT_SECRET:-}
      OPS_OIDC_GROUP: ${OPS_OIDC_GROUP:-}
      OPS_SESSION_SECRET: ${OPS_SESSION_SECRET:-}
      PROVISION_URL: http://provisioner:3005
      PROVISION_SECRET: *provision-secret
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-}
      SITES_DOMAIN: ${SITES_DOMAIN:-}
      EDGE_IPV4: ${EDGE_IPV4:-}
    networks:
      - default
      - provision
    ports:
      - "127.0.0.1:3004:3004"
    stop_grace_period: 30s

networks:
  # Only ops and the provisioner join it, and it has no route out.
  provision:
    internal: true
  # The provisioner's own way out, to Postgres and the email gateway.
  provisioner-egress: {}

volumes:
  files:
