[package]
name = "farida-media"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
publish = false
license = "FSL-1.1-ALv2"
description = "Turns a school's uploaded video into adaptive streams and serves them behind sealed links"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
futures = "0.3.34"
hmac = "0.13.0"
image = { version = "0.25.10", default-features = false, features = [
  "avif",
  "gif",
  "jpeg",
  "png",
  "rayon",
  "webp",
] }
object_store = { version = "0.14.2", features = ["aws"] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  "json",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
thumbhash = "0.1.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
webp = { version = "0.3.1", default-features = false }

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
correctness = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
dbg_macro = "warn"
