name: "Setup and install"
description: "Common setup steps for Actions"

runs:
  using: composite
  steps:
    # Bun 1.4 reads lockfileVersion 2. Keep in step with packageManager and Dockerfile.
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.4

    # setup-bun does not install Node, and vite, vitest and playwright all execute
    # on Node via their shebangs -- both runtimes are required.
    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}

    # setup-bun caches only the bun executable, not the dependency store.
    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-

    # Install fetches the Scratch editor and mirrors its library, some 1,350
    # files from Scratch's servers; a run asks for them only when the script
    # that names them changes.
    - name: Cache the coding studio
      uses: actions/cache@v6
      with:
        path: apps/api/vendor/scratch
        key: scratch-${{ hashFiles('apps/api/scripts/scratch.ts') }}

    - shell: bash
      run: bun install --frozen-lockfile
