name: CI
on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  merge_group:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  NODE_VERSION: 24
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/setup
      - run: bun run db:up
      - run: bun run test:e2e:install
      - run: bun run format
      - run: bun run ready
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/media
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.98 --profile minimal --component rustfmt,clippy && rustup default 1.98
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            apps/media/target
          key: media-${{ runner.os }}-${{ hashFiles('apps/media/Cargo.lock') }}
      # The tests encode a clip, so they need the tools the service drives.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
  # Every target builds on every change; nothing is pushed from here.
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [web, api, collab, ops, migrate, media, edge, backup]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: faridalms-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}-amd64
          cache-to: type=gha,scope=${{ matrix.target }}-amd64,mode=max
      - name: Missing configuration fails startup
        if: matrix.target != 'backup'
        run: |
          if docker run --rm faridalms-${{ matrix.target }}:ci; then
            echo "::error::Service accepted missing configuration"
            exit 1
          fi
      # Without a backup bucket the job does nothing, and says so.
      - name: Missing configuration is a logged no-op
        if: matrix.target == 'backup'
        run: docker run --rm faridalms-backup:ci run | grep 'not configured'

  # After main passes, each target is built on a runner of each architecture
  # (no emulation) and pushed by digest, then the two digests are joined
  # under the commit's tag and `main`. The server pulls linux/arm64.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, media, images]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [web, api, collab, ops, migrate, media, edge, backup]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/faridalms-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          # The source label links the package to this repository, so it
          # takes the repository's access.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }},mode=max
      - run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifests:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [web, api, collab, ops, migrate, media, edge, backup]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/faridalms-${{ matrix.target }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - working-directory: ${{ runner.temp }}/digests
        run: |
          refs=()
          for digest in *; do refs+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.revision=${{ github.sha }}" \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:main" \
            "${refs[@]}"
      - run: docker buildx imagetools inspect "$IMAGE:${{ github.sha }}"
