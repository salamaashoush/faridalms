name: CI
on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  merge_group:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  NODE_VERSION: 24
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/setup
      - run: bun run db:up
      - run: bun run test:e2e:install
      - run: bun run format
      - run: bun run ready
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [web, api]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: faridalms-${{ matrix.target }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Missing configuration fails startup
        run: |
          if docker run --rm faridalms-${{ matrix.target }}:ci; then
            echo "::error::Service accepted missing configuration"
            exit 1
          fi
