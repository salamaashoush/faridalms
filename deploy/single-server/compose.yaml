# One cell on one server: Postgres, the apps, the media service, the edge and
# the nightly backup. Images come from the registry by tag; nothing is built
# here. Configuration is the .env beside this file (see env.example), and the
# runbook is README.md.
#
# Profiles add what not every server needs (COMPOSE_PROFILES in .env):
#   console  the operator console and its provisioner, to create and manage
#            schools from a browser signed in through OpenID Connect
#   storage  a file store on this server, for when there is no S3 service
#   tools    `docker compose run --rm admin ...`, schools from the shell
#
# The project name keeps these volumes apart from a development checkout's.
name: farida-cell

x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

x-service: &service
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true

x-cell-secret: &cell-secret ${CELL_SECRET:?Set CELL_SECRET, 32 random bytes in base64}
# Only the console and its provisioner use it, so it may be unset without them.
x-provision-secret: &provision-secret ${PROVISION_SECRET:-}
x-portal-domain: &portal-domain ${PORTAL_DOMAIN:?Set PORTAL_DOMAIN, for example example.com}
x-sites-domain: &sites-domain ${SITES_DOMAIN:?Set SITES_DOMAIN, for example example.net}

# The file store, as the API and the media service read it alike.
x-storage: &storage
  FILE_STORAGE: s3
  S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT}
  S3_REGION: ${S3_REGION:?Set S3_REGION}
  S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-virtual}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
  FILE_BUCKET: ${FILE_BUCKET:?Set FILE_BUCKET}
  PUBLIC_MEDIA_BUCKET: ${PUBLIC_MEDIA_BUCKET:?Set PUBLIC_MEDIA_BUCKET}

services:
  postgres:
    <<: *service
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    # Sized for 8 GB shared with the apps. Connections: each API replica
    # opens 26 (app 10, site 5, worker 4, retention 1, directory 4,
    # directory_sync 2), the provisioner 16, collab 4, the console 4, a
    # migration 1 or 2 and a dump 1; 100 leaves room for a second API during
    # an upgrade and for psql.
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=1536MB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_wal_size=2GB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - log_line_prefix=%m [%p] %q%u@%d
      - -c
      - log_min_duration_statement=500ms
      - -c
      - log_lock_waits=on
      - -c
      - log_temp_files=10MB
      - -c
      - log_autovacuum_min_duration=10s
    # Parallel queries share memory through /dev/shm, 64 MB by default.
    shm_size: 256m
    volumes:
      # Postgres 18 keeps its cluster in a versioned subdirectory of this path.
      - postgres:/var/lib/postgresql
    networks: [data, provisioner-data]
    # For psql through an SSH tunnel; never on a public address.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    stop_grace_period: 60s
    oom_score_adj: -500
    deploy:
      resources:
        limits:
          memory: 3g

  # Provisions the roles, creates what is missing and applies pending
  # migrations, then exits; everything that reads the cell waits for it.
  migrate:
    image: ${IMAGE_PREFIX:-ghcr.io/salamaashoush/faridalms}-migrate:${IMAGE_TAG:?Set IMAGE_TAG to a commit SHA or main}
    restart: "no"
    logging: *logging
    command: ["bun", "migrate.js", "create"]
    environment:
      DATABASE_ADMIN_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      CELL_DATABASE: cell
      DIRECTORY_DATABASE: directory
      CELL_ROLE_PASSWORD: ${CELL_ROLE_PASSWORD:?Set CELL_ROLE_PASSWORD, 32 random bytes in hex}
      # The cell lists itself in the directory as open for schools.
      CELL_ID: ${CELL_ID:?Set CELL_ID, for example eu-1}
      PORTAL_DOMAIN: *portal-domain
      CELL_JURISDICTION: ${CELL_JURISDICTION:?Set CELL_JURISDICTION, the two-letter country the data is kept in}
      CELL_PROVIDER: ${CELL_PROVIDER:-}
      CELL_REGION: ${CELL_REGION:-}
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

  api:
    <<: *service
    image: ${IMAGE_PREFIX:-ghcr.io/salamaashoush/faridalms}-api:${IMAGE_TAG:?Set IMAGE_TAG to a commit SHA or main}
    environment:
      <<: *storage
      CELL_ID: ${CELL_ID:?Set CELL_ID, for example eu-1}
      CELL_KEK: ${CELL_KEK:?Set CELL_KEK, 32 random bytes in base64}
      CELL_SECRET: *cell-secret
      CELL_APP_URL: postgres://app:${CELL_ROLE_PASSWORD}@postgres:5432/cell
      CELL_SITE_URL: postgres://site:${CELL_ROLE_PASSWORD}@postgres:5432/cell
      # Settles uploads, delivers notifications and keeps partitions ahead.
      CELL_WORKER_URL: postgres://worker:${CELL_ROLE_PASSWORD}@postgres:5432/cell
      CELL_RETENTION_URL: postgres://retention:${CELL_ROLE_PASSWORD}@postgres:5432/cell
      DIRECTORY_URL: postgres://directory_reader:${CELL_ROLE_PASSWORD}@postgres:5432/directory
      # Reports storage, and binds and checks schools' own hosts.
      DIRECTORY_SYNC_URL: postgres://directory_sync:${CELL_ROLE_PASSWORD}@postgres:5432/directory
      PORTAL_DOMAIN: *portal-domain
      SITES_DOMAIN: *sites-domain
      EDGE_IPV4: ${EDGE_IPV4:-}
      FILES_PORT: 3003
      FILES_ORIGIN: https://files.${SITES_DOMAIN}
      MEDIA_ORIGIN: https://media.${SITES_DOMAIN}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-}
      CLAMD_ADDRESS: ${CLAMD_ADDRESS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_WEBHOOK_URL: ${EMAIL_WEBHOOK_URL:-}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      NOTIFY_WEBHOOK_TOKEN: ${NOTIFY_WEBHOOK_TOKEN:-}
      TRUSTED_PROXY_HOPS: 1
    networks: [front, data]
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-buckets:
        condition: service_completed_successfully
        required: false
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g

  web:
    <<: *service
    image: ${IMAGE_PREFIX:-ghcr.io/salamaashoush/faridalms}-web:${IMAGE_TAG:?Set IMAGE_TAG to a commit SHA or main}
    environment:
      BACKEND_URL: http://api:3001
      PORTAL_DOMAIN: *portal-domain
      SITES_DOMAIN: *sites-domain
      COLLAB_URL: wss://collab.${PORTAL_DOMAIN}
      # The files host: students' web pages play there and the studios open.
      PLAY_URL: https://files.${SITES_DOMAIN}
      TRUSTED_PROXY_HOPS: 1
    networks: [front]
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m

  collab:
    <<: *service
    image: ${IMAGE_PREFIX:-ghcr.io/salamaashoush/faridalms}-collab:${IMAGE_TAG:?Set IMAGE_TAG to a commit SHA or main}
    environment:
      CELL_COLLAB_URL: postgres://collab:${CELL_ROLE_PASSWORD}@postgres:5432/cell
      CELL_SECRET: *cell-secret
    networks: [front, data]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - fetch('http://127.0.0.1:3002/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 384m

  # Encoding takes every core it is given, so it is given two of four and a
  # ceiling on memory, and is the first thing the kernel stops if the server
  # runs short.
  media:
    <<: *service
    image: ${IMAGE_PREFIX:-ghcr.io/salamaashoush/faridalms}-media:${IMAGE_TAG:?Set IMAGE_TAG to a commit SHA or main}
    environment:
      <<: *storage
      CELL_SECRET: *cell-secret
      MEDIA_API_URL: http://api:3001
      MEDIA_JOBS: 1
    networks: [front]
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 20s
    oom_score_adj: 500
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  # The API image holding the provisioner login, which may become
  # cell_owner, to create schools for the console. Its only networks are the
  # console's, which has no way out, and its own way to Postgres and the
  # email gateway, so the public API cannot reach it.
  provisioner:
    <<: *service
    profiles: [console]
    image: ${IMAGE_PREFIX:-ghcr.io/salamaashoush/faridalms}-api:${IMAGE_TAG:?Set IMAGE_TAG to a commit SHA or main}
    environment:
      CELL_ID: ${CELL_ID:?Set CELL_ID, for example eu-1}
      CELL_KEK: ${CELL_KEK:?Set CELL_KEK, 32 random bytes in base64}
      CELL_SECRET: *cell-secret
      CELL_APP_URL: postgres://app:${CELL_ROLE_PASSWORD}@postgres:5432/cell
      DIRECTORY_URL: postgres://directory_reader:${CELL_ROLE_PASSWORD}@postgres:5432/directory
      # The first administrator's link points at the school's portal.
      PORTAL_DOMAIN: *portal-domain
      SITES_DOMAIN: *sites-domain
      CELL_PROVISION_URL: postgres://provisioner:${CELL_ROLE_PASSWORD}@postgres:5432/cell
      PROVISION_SECRET: *provision-secret
      PROVISION_PORT: 3005
      PROVISION_HOST: 0.0.0.0
      # The link goes out before the school is kept; without a gateway the
      # provisioner refuses to create one.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_WEBHOOK_URL: ${EMAIL_WEBHOOK_URL:-}
      NOTIFY_WEBHOOK_TOKEN: ${NOTIFY_WEBHOOK_TOKEN:-}
    networks: [provision, provisioner-data]
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 384m

  ops:
    <<: *service
    profiles: [console]
    image: ${IMAGE_PREFIX:-ghcr.io/salamaashoush/faridalms}-ops:${IMAGE_TAG:?Set IMAGE_TAG to a commit SHA or main}
    environment:
      OPS_DIRECTORY_URL: postgres://directory_admin:${CELL_ROLE_PASSWORD}@postgres:5432/directory
      OPS_ORIGIN: https://ops.${PORTAL_DOMAIN}
      OPS_OIDC_ISSUER: ${OPS_OIDC_ISSUER:-https://accounts.google.com}
      OPS_OIDC_CLIENT_ID: ${OPS_OIDC_CLIENT_ID:-}
      OPS_OIDC_CLIENT_SECRET: ${OPS_OIDC_CLIENT_SECRET:-}
      # One of the two: a group of the provider, or verified addresses.
      OPS_OIDC_GROUP: ${OPS_OIDC_GROUP:-}
      OPS_OIDC_EMAILS: ${OPS_OIDC_EMAILS:-}
      OPS_OIDC_GROUP_CLAIM: ${OPS_OIDC_GROUP_CLAIM:-}
      OPS_SESSION_SECRET: ${OPS_SESSION_SECRET:-}
      PROVISION_URL: http://provisioner:3005
      PROVISION_SECRET: *provision-secret
      PORTAL_DOMAIN: *portal-domain
      SITES_DOMAIN: *sites-domain
      EDGE_IPV4: ${EDGE_IPV4:-}
    networks: [front, data, provision]
    depends_on:
      migrate:
        condition: service_completed_successfully
      provisioner:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - fetch('http://127.0.0.1:3004/sign-in').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 384m

  edge:
    <<: *service
    image: ${IMAGE_PREFIX:-ghcr.io/salamaashoush/faridalms}-edge:${IMAGE_TAG:?Set IMAGE_TAG to a commit SHA or main}
    environment:
      PORTAL_DOMAIN: *portal-domain
      SITES_DOMAIN: *sites-domain
      # acme: a certificate per name from Let's Encrypt on its first visit,
      # needing nothing but ports 80 and 443. cloudflare: two wildcard
      # certificates by DNS-01, with the token below.
      EDGE_TLS: ${EDGE_TLS:-acme}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      EDGE_LOG_LEVEL: ${EDGE_LOG_LEVEL:-INFO}
    ports:
      - "80:80"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      # Certificates and the ACME account; losing them means issuing again
      # against Let's Encrypt's weekly limits.
      - caddy-data:/data
      - caddy-config:/config
    networks: [front]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 256m

  # Schools from the shell, for a server without the console:
  #   docker compose run --rm admin create-school --help
  # It holds the provisioner's login and the directory's, and leaves when done.
  admin:
    profiles: [tools]
    image: ${IMAGE_PREFIX:-ghcr.io/salamaashoush/faridalms}-api:${IMAGE_TAG:?Set IMAGE_TAG to a commit SHA or main}
    restart: "no"
    logging: *logging
    entrypoint: ["bun", "dist/admin.js"]
    environment:
      CELL_ID: ${CELL_ID:?Set CELL_ID, for example eu-1}
      CELL_KEK: ${CELL_KEK:?Set CELL_KEK, 32 random bytes in base64}
      CELL_JURISDICTION: ${CELL_JURISDICTION:-}
      CELL_PROVISION_URL: postgres://provisioner:${CELL_ROLE_PASSWORD}@postgres:5432/cell
      DIRECTORY_URL: postgres://directory_reader:${CELL_ROLE_PASSWORD}@postgres:5432/directory
      DIRECTORY_ADMIN_URL: postgres://directory_admin:${CELL_ROLE_PASSWORD}@postgres:5432/directory
      PORTAL_DOMAIN: *portal-domain
      SITES_DOMAIN: *sites-domain
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_WEBHOOK_URL: ${EMAIL_WEBHOOK_URL:-}
      NOTIFY_WEBHOOK_TOKEN: ${NOTIFY_WEBHOOK_TOKEN:-}
    networks: [provisioner-data]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # A file store on this server (SeaweedFS), for when there is no S3 service:
  # set S3_ENDPOINT=http://storage:8333 and S3_ADDRESSING_STYLE=path, and
  # choose the S3 keys it is to accept. The files live in the storage volume;
  # back it up as you back up the rest of the server.
  storage:
    <<: *service
    profiles: [storage]
    image: chrislusf/seaweedfs:4.51
    # It binds to one detected address unless told otherwise, which would
    # leave it unreachable from one of its two networks.
    command:
      ["server", "-dir=/data", "-s3", "-s3.port=8333", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - storage:/data
    networks: [front, data]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 512m

  # Creates the two buckets in the store if they are missing, then exits.
  storage-buckets:
    profiles: [storage]
    image: curlimages/curl:8.17.0
    restart: "no"
    logging: *logging
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      FILE_BUCKET: ${FILE_BUCKET}
      PUBLIC_MEDIA_BUCKET: ${PUBLIC_MEDIA_BUCKET}
    entrypoint: ["sh", "-c"]
    command:
      - |
        for bucket in "$$FILE_BUCKET" "$$PUBLIC_MEDIA_BUCKET"; do
          code=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT \
            --aws-sigv4 "aws:amz:us-east-1:s3" \
            --user "$$S3_ACCESS_KEY_ID:$$S3_SECRET_ACCESS_KEY" \
            "http://storage:8333/$$bucket")
          case "$$code" in
            200 | 409) echo "bucket $$bucket ready" ;;
            *) echo "bucket $$bucket: HTTP $$code" && exit 1 ;;
          esac
        done
    networks: [data]
    depends_on:
      storage:
        condition: service_healthy

  backup:
    <<: *service
    image: ${IMAGE_PREFIX:-ghcr.io/salamaashoush/faridalms}-backup:${IMAGE_TAG:?Set IMAGE_TAG to a commit SHA or main}
    init: true
    environment:
      PGHOST: postgres
      PGUSER: backup_dump
      PGPASSWORD: ${CELL_ROLE_PASSWORD}
      CELL_DATABASE: cell
      DIRECTORY_DATABASE: directory
      BACKUP_AT: ${BACKUP_AT:-02:30}
      # Unset, the job logs that it is not configured and does nothing.
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      # The file buckets are read with the API's keys.
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-virtual}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      FILE_BUCKET: ${FILE_BUCKET}
      PUBLIC_MEDIA_BUCKET: ${PUBLIC_MEDIA_BUCKET}
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "farida-backup", "health"]
      interval: 1m
      timeout: 5s
      retries: 1
    oom_score_adj: 500
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m

networks:
  # The edge and what it routes to.
  front: {}
  # Postgres and every process that logs in to it, except the provisioner.
  data: {}
  # Postgres and the provisioner, which also reaches the email gateway here.
  provisioner-data: {}
  # The console's calls to the provisioner. No way out.
  provision:
    internal: true

volumes:
  postgres:
  caddy-data:
  caddy-config:
  storage:
