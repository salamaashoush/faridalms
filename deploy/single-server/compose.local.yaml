# The single-server stack on a workstation, for smoke.sh: images built
# locally (IMAGE_PREFIX=faridalms, IMAGE_TAG=local), certificates on demand
# from Caddy's own authority instead of Let's Encrypt, MinIO standing in for
# the backup bucket at another provider, and ports that leave the
# workstation's own 80, 443 and 5432 alone.
services:
  postgres:
    ports: !override
      - "127.0.0.1:55432:5432"

  edge:
    environment:
      EDGE_TLS: internal
    ports: !override
      - "127.0.0.1:58080:80"
      - "127.0.0.1:58443:443/tcp"

  minio:
    image: cgr.dev/chainguard/minio@sha256:3b6e40c30ecd5cea627e382ff0b82ca841f58c52294578787043ee80c8ef7c82
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - minio:/data
    networks: [front, data]
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

volumes:
  minio:
