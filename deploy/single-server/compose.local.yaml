# The single-server stack on a workstation, for smoke.sh: images built
# locally (IMAGE_PREFIX=faridalms, IMAGE_TAG=local), certificates from
# Caddy's own authority instead of Cloudflare, MinIO in place of both the
# file store and the backup bucket, and ports that leave the workstation's
# own 80, 443 and 5432 alone.
services:
  postgres:
    ports: !override
      - "127.0.0.1:55432:5432"

  edge:
    environment:
      EDGE_TLS: internal
    ports: !override
      - "127.0.0.1:58080:80"
      - "127.0.0.1:58443:443/tcp"

  minio:
    image: cgr.dev/chainguard/minio@sha256:3b6e40c30ecd5cea627e382ff0b82ca841f58c52294578787043ee80c8ef7c82
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
      # Buckets as the first label of the host, as Hetzner addresses them.
      MINIO_DOMAIN: minio
    volumes:
      - minio:/data
    networks:
      front:
        aliases: [faridalms-files.minio, faridalms-media.minio, backups.minio]
      data:
        aliases: [faridalms-files.minio, faridalms-media.minio, backups.minio]
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

volumes:
  minio:
